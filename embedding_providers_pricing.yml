  mistral:
    cost_model: per_token
    pricing_url: "https://mistral.ai/pricing/"
    description:
      fr: "Format de réponse API identique à OpenAI (drop-in). Batch API = -50%."
      en: "API response format identical to OpenAI (drop-in). Batch API = -50%."
    models:
      - name: "mistral-embed"
        dim: 1024
        price_per_1m: 0.10
        description:
          fr: "Généraliste texte. Format réponse identique OpenAI."
          en: "General-purpose text. OpenAI-identical response format."
      - name: "codestral-embed-2505"
        dim: 1536           # défaut ; Matryoshka (256/512/1024...)
        price_per_1m: 0.15
        price_batch: "-50%"
        description:
          fr: >
            Spécialisé code, Matryoshka. /!\ Ton tableau indique dim 3072 :
            le défaut documenté est plutôt 1536, et la dimension est tronquable.
            Figer `output_dimension` côté API pour caler la colonne pgvector.
          en: >
            Code-specialized, Matryoshka. /!\ Your table lists dim 3072: the
            documented default is rather 1536, and the dimension is truncatable.
            Pin `output_dimension` on the API side to match the pgvector column.

  # ===========================================================================
  jina:
    cost_model: token_package    # paquets de tokens prépayés, pas pur per-token
    pricing_url_embeddings: "https://jina.ai/embeddings/"
    pricing_url_reranker: "https://jina.ai/reranker/"
    description:
      fr: >
        Une même clé API + un même pool de tokens partagé entre embeddings,
        reranking, reader, classifier et fine-tuning. 10M tokens gratuits par
        nouvelle clé, puis achat de paquets. Reranker aligné sur le pricing
        embeddings.
      en: >
        One API key + one shared token pool across embeddings, reranking,
        reader, classifier and fine-tuning. 10M free tokens per new key, then
        package purchase. Reranker pricing aligned with embeddings.
    models:
      - name: "jina-embeddings-v3"
        type: embedding
        dim: 1024
        price_per_1m: 0.02      # ordre de grandeur paquet ; voir page pricing
        free_tokens: 10_000_000
        description:
          fr: >
            task=retrieval.passage / retrieval.query, 100+ langues, contexte 8192.
          en: >
            task=retrieval.passage / retrieval.query, 100+ languages, 8192 context.
      - name: "jina-reranker-v2-base-multilingual"
        type: reranker
        dim: null
        price_per_1m: 0.02      # aligné embeddings ; voir page pricing
        free_tokens: 10_000_000
        description:
          fr: >
            100+ langues, API proche Cohere, contexte 1024 tokens (chunking auto
            au-delà). Note : v3 et m0 existent désormais (contexte bien plus
            large) si besoin de monter en gamme.
          en: >
            100+ languages, Cohere-like API, 1024-token context (auto chunking
            beyond). Note: v3 and m0 now exist (much larger context) if you need
            to move up a tier.

  # ===========================================================================
  gemini:
    cost_model: per_token
    pricing_url: "https://ai.google.dev/gemini-api/docs/pricing"
    description:
      fr: >
        API Google AI (Gemini) — free tier disponible sur tous les modèles embedding.
        En production, facturation au token. Batch API = -50% sur gemini-embedding-2.
        text-embedding-004 et gemini-embedding-exp-03-07 sont arrêtés depuis le
        14/01/2026 ; migrer vers gemini-embedding-001 ou gemini-embedding-2.
      en: >
        Google AI (Gemini) API — free tier available on all embedding models.
        In production, token-based billing. Batch API = -50% on gemini-embedding-2.
        text-embedding-004 and gemini-embedding-exp-03-07 shut down since
        14/01/2026; migrate to gemini-embedding-001 or gemini-embedding-2.
    models:
      - name: "gemini-embedding-001"
        type: embedding
        dim: 3072              # défaut ; Matryoshka (768 / 1536 / 3072)
        migration: null
        price_per_1m: 0.15
        price_per_1m_batch: 0.075
        statut: "current"
        description:
          fr: >
            Modèle embedding texte officiel. Matryoshka : dimensions 768 / 1536 / 3072.
            Contexte max 2 048 tokens. Figer `output_dimensionality` côté API.
            Batch API = -50%.
          en: >
            Official text embedding model. Matryoshka: dimensions 768 / 1536 / 3072.
            Max context 2,048 tokens. Pin `output_dimensionality` on the API side.
            Batch API = -50%.
      - name: "gemini-embedding-2"
        type: embedding
        dim: null              # multimodal — texte / image / audio / vidéo / PDF
        migration: null
        price_per_1m_text: 0.20
        price_per_1m_text_batch: 0.10
        price_per_1m_image: 0.45
        price_per_1m_image_batch: 0.225
        price_per_1m_audio: 6.50
        price_per_1m_audio_batch: 3.25
        price_per_1m_video: 12.00
        price_per_1m_video_batch: 6.00
        statut: "current"
        description:
          fr: >
            Modèle multimodal : texte, image ($0,45/1M), audio ($6,50/1M), vidéo
            ($12/1M), PDF. Batch API = -50% sur tous les types. Le plus cher mais
            le seul à couvrir tous les types de contenu.
          en: >
            Multimodal model: text, image ($0.45/1M), audio ($6.50/1M), video
            ($12/1M), PDF. Batch API = -50% on all types. Most expensive but the
            only one covering all content types.
      - name: "text-embedding-004"
        type: embedding
        dim: 768
        statut: "shutdown"
        shutdown_date: "2026-01-14"
        description:
          fr: "Arrêté le 14/01/2026. Utiliser gemini-embedding-001 à la place."
          en: "Shut down 14/01/2026. Use gemini-embedding-001 instead."
      - name: "gemini-embedding-exp-03-07"
        type: embedding
        dim: 3072
        statut: "shutdown"
        shutdown_date: "2026-01-14"
        description:
          fr: "Arrêté. Remplacé par gemini-embedding-001 (même gamme de dimensions)."
          en: "Shut down. Replaced by gemini-embedding-001 (same dimension range)."

  # ===========================================================================
  dashscope:
    cost_model: per_token
    pricing_url: "https://www.alibabacloud.com/help/en/model-studio/model-pricing"
    description:
      fr: >
        Dashscope (Alibaba Cloud) — endpoint OpenAI-compatible. Une clé API
        unique couvre embeddings ET reranking. Facturation au token, région
        Singapore (tarifs USD). Free quota 90 jours à l'activation de Model Studio.
        Remarque : les modèles qwen3-embedding-* tournent aussi en local via Ollama
        (voir section ollama pour le coût $0).
      en: >
        Dashscope (Alibaba Cloud) — OpenAI-compatible endpoint. A single API key
        covers both embeddings AND reranking. Token-based billing, Singapore region
        (USD prices). Free quota 90 days on Model Studio activation.
        Note: qwen3-embedding-* models also run locally via Ollama (see ollama
        section for $0 cost).
    models:
      - name: "text-embedding-v4"
        type: embedding
        dim: 1024              # flexible 64–2048d
